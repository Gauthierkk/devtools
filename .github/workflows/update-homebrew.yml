name: Update Homebrew Cask

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-cask:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName)
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get DMG asset name
        id: asset
        shell: bash
        run: |
          ASSET=$(gh release view "$TAG" --repo ${{ github.repository }} --json releaseAssets -q '.releaseAssets[] | select(.name | endswith(".dmg")) | .name' | head -n 1)
          if [ -z "$ASSET" ]; then
            echo "No DMG asset found for release $TAG" >&2
            exit 1
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Download release DMG and hash it
        id: hash
        shell: bash
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/${{ steps.asset.outputs.asset }}"
          SHA=$(curl -L "$URL" | shasum -a 256 | awk '{print $1}')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew tap
        run: |
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/Gauthierkk/homebrew-tap.git

      - name: Update devtools cask
        run: |
          cd homebrew-tap
          sed -i '' 's|version ".*"|version "${{ steps.release.outputs.version }}"|' Casks/devtools.rb
          sed -i '' 's|url ".*"|url "${{ steps.hash.outputs.url }}"|' Casks/devtools.rb
          sed -i '' 's|sha256 ".*"|sha256 "${{ steps.hash.outputs.sha256 }}"|' Casks/devtools.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git remote set-url origin https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/Gauthierkk/homebrew-tap.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/devtools.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update devtools cask to ${{ steps.release.outputs.version }}"
          git push
